name: CI

on:
  push:
    branches: [main]
  pull_request:

# Never expose cloud credentials to CI. Future GCP deploys will use
# Workload Identity Federation (OIDC) — see docs/deployment/GCP_DEPLOYMENT.md.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowhub
          POSTGRES_PASSWORD: flowhub_ci_password
          POSTGRES_DB: flowhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowhub -d flowhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flowhub:flowhub_ci_password@localhost:5432/flowhub
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm --filter @flowhub/database db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t flowhub-api:ci .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t flowhub-worker:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t flowhub-web:ci .
