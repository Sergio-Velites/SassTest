name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep, Mondays 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CodeQL code scanning: enable via GitHub repo Settings > Security > Code scanning
  # (default setup), or replace this placeholder with github/codeql-action once the
  # repo plan supports it. Tracked in docs/product/BACKLOG.md (Cycle 9 hardening).
