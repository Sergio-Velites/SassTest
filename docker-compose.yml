# Local development infrastructure for FlowHub AI.
# Usage: pnpm db:up  (or: docker compose up -d)
# These credentials are for LOCAL DEVELOPMENT ONLY — never reuse them anywhere.
services:
  postgres:
    image: postgres:16-alpine
    container_name: flowhub-postgres
    environment:
      POSTGRES_USER: flowhub
      POSTGRES_PASSWORD: flowhub_dev_password
      POSTGRES_DB: flowhub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowhub -d flowhub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowhub-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
